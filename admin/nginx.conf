server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: fall back to index.html for any unknown path
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built static assets aggressively; index.html stays uncached
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
